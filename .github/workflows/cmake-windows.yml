name: Secure Windows CMake Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 

    - name: Export GitHub Actions Cache Environment
      uses: actions/github-script@v7
      with:
        script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    
    - name: Install vcpkg Dependencies
      run: |
        vcpkg install `
          opencv `
          libraw `
          --triplet=x64-windows

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DWITH_LIBRAW=ON -DVCPKG_APPLOCAL_DEPS=ON -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Build Application
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Prepare Distribution Folder
      run: |
        New-Item -ItemType Directory -Force -Path dist
        Copy-Item "build/${{env.BUILD_TYPE}}/*.exe" -Destination dist/ -Force
        Copy-Item "build/${{env.BUILD_TYPE}}/*.dll" -Destination dist/ -Force -ErrorAction SilentlyContinue

    - name: Create Self-Signed Cert and Sign App
      shell: powershell
      run: |
        $cert = New-SelfSignedCertificate -Type CodeSigning -CertStoreLocation Cert:\CurrentUser\My -Subject "CN=github/Eraldo-Bako"
        $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64" -Filter signtool.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
        & $signtool sign /sha1 $cert.Thumbprint /fd sha256 "dist/fconvert.exe"
        
    - name: Upload Clean Windows Binary
      uses: actions/upload-artifact@v4
      with:
        name: fconvert-windows-x64
        path: dist/
